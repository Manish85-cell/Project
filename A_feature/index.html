<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Code Quality Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 10px;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Code Quality Analyzer</h1>
        
        <textarea id="code-input" placeholder="Paste your code here..."></textarea>
        <button id="analyze-btn">Analyze</button>

        <div id="results">
            <p>DRY Principle: <span id="dry-result" class="result unknown">UNKNOWN</span></p>
            <p>Code Styling: <span id="style-result" class="result unknown">UNKNOWN</span></p>
            <p>Readability: <span id="readability-result" class="result unknown">UNKNOWN</span></p>
            <p>Comments: <span id="comments-result" class="result unknown">UNKNOWN</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
